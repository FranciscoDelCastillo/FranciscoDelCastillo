<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Hector Francisco del Castillo Vega — Desarrollo web, sistemas a la medida y automatización">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2f6bff" stroke-opacity=".13" stroke-width="1"/>
    </pattern>
    <radialGradient id="gb" cx="85%" cy="10%" r="60%"><stop offset="0" stop-color="#2f6bff" stop-opacity=".45"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="gr" cx="5%" cy="100%" r="50%"><stop offset="0" stop-color="#ff2340" stop-opacity=".28"/><stop offset="1" stop-color="#ff2340" stop-opacity="0"/></radialGradient>
    <linearGradient id="pc" x1="0" x2="1"><stop offset="0" stop-color="#4cc3ff" stop-opacity="0"/><stop offset="1" stop-color="#4cc3ff"/></linearGradient>
    <linearGradient id="pr" x1="0" x2="1"><stop offset="0" stop-color="#ff2340" stop-opacity="0"/><stop offset="1" stop-color="#ff2340"/></linearGradient>
    <clipPath id="clip"><rect width="1200" height="340" rx="18"/></clipPath>
    <style>
      .f{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      .m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .up{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
      .d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}
      @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
      .caret{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .ln{opacity:0;animation:ln 9s infinite}
      .l2{animation-delay:.9s}.l3{animation-delay:1.8s}.l4{animation-delay:2.7s}.l5{animation-delay:3.6s}.l6{animation-delay:4.5s}
      @keyframes ln{0%{opacity:0;transform:translateX(-8px)}5%,88%{opacity:1;transform:none}96%,100%{opacity:0}}
      .pulse{animation:pulse 2s ease-out infinite;transform-origin:1048px 40px}
      @keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="#000"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#gb)"/>
    <rect width="1200" height="340" fill="url(#gr)"/>
    <rect y="80" width="90" height="2" fill="url(#pc)"><animate attributeName="x" from="-120" to="1240" dur="6s" repeatCount="indefinite"/></rect>
    <rect y="240" width="90" height="2" fill="url(#pr)"><animate attributeName="x" from="-120" to="1240" dur="8s" begin="1.5s" repeatCount="indefinite"/></rect>
    <rect y="160" width="70" height="2" fill="url(#pc)"><animate attributeName="x" from="-120" to="1240" dur="5s" begin="3s" repeatCount="indefinite"/></rect>
    <rect x="680" width="2" height="70" fill="#4cc3ff" opacity=".7"><animate attributeName="y" from="-80" to="360" dur="5.5s" begin=".8s" repeatCount="indefinite"/></rect>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="18" fill="none" stroke="#1a2547"/>

  <g class="up">
    <rect x="60" y="34" width="38" height="38" rx="11" fill="#060a18" stroke="#2f6bff" stroke-width="1.5"/>
    <path d="M74 46l-7 7 7 7" fill="none" stroke="#4cc3ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M84 46l7 7-7 7" fill="none" stroke="#ff2340" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M81 44l-4 18" stroke="#e8ecf5" stroke-width="2.4" stroke-linecap="round"/>
    <text x="112" y="59" class="f" font-size="15" font-weight="600" fill="#8a93a8">Desarrollo web &amp; sistemas</text>
  </g>

  <g>
    <circle cx="1048" cy="40" r="5" fill="#25d366" class="pulse"/>
    <circle cx="1048" cy="40" r="5" fill="#25d366"/>
    <text x="1063" y="45" class="f" font-size="14" font-weight="600" fill="#c9d0e0">Veracruz, México</text>
  </g>

  <text x="60" y="142" class="f up d1" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Hector Francisco</text>
  <text x="60" y="206" class="f up d2" font-size="56" font-weight="800" fill="none" stroke="#4cc3ff" stroke-width="1.6" letter-spacing="-1.5">del Castillo Vega</text>
  <g class="up d3">
    <text x="60" y="254" class="f" font-size="21" fill="#c2c9da">Páginas web, sistemas a la medida y <tspan fill="#ffffff" font-weight="700">automatización de procesos</tspan>.</text>
  </g>
  <g class="up d4">
    <rect x="60" y="276" width="10" height="28" fill="#ff2340" class="caret"/>
    <text x="82" y="298" class="f" font-size="19" font-weight="700" fill="#ff2340">Si una tarea se puede hacer sola, la programo.</text>
  </g>

  <g transform="translate(760 96)">
    <rect width="380" height="210" rx="14" fill="#060a18" stroke="#1a2547"/>
    <circle cx="20" cy="20" r="5" fill="#ff5f57"/><circle cx="38" cy="20" r="5" fill="#febc2e"/><circle cx="56" cy="20" r="5" fill="#28c840"/>
    <text x="364" y="24" text-anchor="end" class="m" font-size="11" fill="#5b6478">automatizar.js</text>
    <line x1="0" y1="38" x2="380" y2="38" stroke="#1a2547"/>
    <text class="m" font-size="14">
      <tspan class="ln" x="20" y="66"><tspan fill="#ff6b80">const</tspan><tspan fill="#e8ecf5"> negocio = </tspan><tspan fill="#4cc3ff">tuEmpresa</tspan><tspan fill="#e8ecf5">();</tspan></tspan>
      <tspan class="ln l2" x="20" y="92"><tspan fill="#e8ecf5">negocio.</tspan><tspan fill="#4cc3ff">automatizar</tspan><tspan fill="#e8ecf5">([</tspan></tspan>
      <tspan class="ln l3" x="38" y="118"><tspan fill="#9fe1cb">'recibos'</tspan><tspan fill="#e8ecf5">, </tspan><tspan fill="#9fe1cb">'recordatorios'</tspan><tspan fill="#e8ecf5">,</tspan></tspan>
      <tspan class="ln l4" x="38" y="144"><tspan fill="#9fe1cb">'reportes'</tspan><tspan fill="#e8ecf5">, </tspan><tspan fill="#9fe1cb">'cobranza'</tspan><tspan fill="#e8ecf5">]);</tspan></tspan>
      <tspan class="ln l5" x="20" y="174" fill="#25d366">✓ 70 recibos enviados por WhatsApp</tspan>
      <tspan class="ln l6" x="20" y="196" fill="#8a93a8">// 16 horas libres este mes</tspan>
    </text>
  </g>
</svg>
